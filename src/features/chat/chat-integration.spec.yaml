feature: Chat — Integration Events
code: chat-integration
description: |
  Интеграционные события чата для других фич (tickets, notifications,
  аналитика). Доставка через Outbox (transactional outbox) → Kafka. Реализация
  Outbox'а — общая обвязка проекта (architecture/4-infra.md).

  Гарантии: at-least-once, идемпотентность по eventId на стороне consumer'ов.
  Outbox-row создаётся в той же транзакции, что и доменные изменения, поэтому
  откат транзакции исключает публикацию.

  Топик Kafka: chat.events (один топик, partition по chatId).
  Тип события несётся в поле type. Получатели фильтруют по type.
  Партиционирование по chatId сохраняет порядок событий в пределах одного чата.

  Слушатели:
    - tickets        — chat.opened (создание тикета по новому диалогу)
    - notifications  — chat.message.created, chat.message.edited
    - analytics      — все события

specs-unit:
  # ==================== ФОРМАТ ====================

  Конверт события:
    - assert: Каждое событие содержит обязательные поля type, eventId, occurredAt, chatId, payload
      description: |
        type — строковый идентификатор (chat.opened, chat.message.created, …)
        eventId — UUID v4, уникален; consumer'ы дедуплицируют по нему
        occurredAt — ISO timestamp
        chatId — UUID, Kafka message key (для партиционирования и ordering)
        payload — type-specific объект
    - assert: Headers Kafka — x-event-type, x-correlation-id, x-source='main-api'

  # ==================== ПУБЛИКАЦИЯ ====================

  Outbox publication:
    - assert: Запись в Outbox — в той же транзакции, что и доменное изменение
    - assert: Откат транзакции не оставляет осиротевших записей в Outbox
    - assert: Outbox-publisher шлёт в Kafka и помечает publishedAt
    - assert: Сбой Kafka — запись в Outbox с retry, событие не теряется
    - assert: Один Outbox-row → одно сообщение в Kafka (eventId — ключ дедупа)
      description: |
        Если publisher отправил, но не успел пометить publishedAt и
        перезапустился — повторная отправка с тем же eventId. Consumer
        обязан быть идемпотентным.

  # ==================== СПИСОК СОБЫТИЙ ====================

  chat.opened:
    - assert: Публикуется при создании нового чата (status=open впервые)
      description: |
        Payload:
          chatId
          participants: [{ participantId, kind, subjectId | null,
                           assignedUserId | null, role }]
          initiatorParticipantId
          initiatorUserId
        Тип чата выводится получателем из набора participants.
        Контекст (товар и т.п.) живёт не на чате, а в первом сообщении
        через `attachments` (см. chat.message.created).

  chat.message.created:
    - assert: Публикуется при отправке любого сообщения, включая системные
      description: |
        Payload: { chatId, messageId, senderParticipantId, actorUserId,
                   kind: 'text'|'media'|'system', text?, mediaIds?,
                   attachments?: MessageAttachment[],
                   systemEvent?, createdAt }.
    - assert: MessageAttachment — discriminated union по kind
      description: |
        Варианты:
          { kind: 'item-ref', itemId: ItemId } — карточка товара
        Расширяется новыми вариантами. Backend не валидирует содержимое —
        клиент прикладывает любые публичные ссылки.
        Иммутабельно после create: edit не меняет attachments.

  chat.message.edited / chat.message.deleted:
    - assert: chat.message.edited
      description: |
        Payload: { chatId, messageId, text?, mediaIds?, editedAt }.
    - assert: chat.message.deleted
      description: Payload: { chatId, messageId, deletedAt }.

  chat.read:
    - assert: chat.read — движение курсора прочтения
      description: |
        Payload: { chatId, readerParticipantId, readerUserId, upToMessageId,
                   readAt }.
        Высокочастотное; consumer должен быть готов к нагрузке либо
        агрегировать.

  participant.claimed / participant.released / participant.reassigned:
    - assert: participant.claimed
      description: |
        Payload: { chatId, participantId, kind, subjectId | null,
                   assignedUserId, claimedAt }.
    - assert: participant.released
      description: |
        Payload: { chatId, participantId, oldAssigneeId, releasedAt }.
    - assert: participant.reassigned
      description: |
        Payload: { chatId, participantId, oldAssigneeId, newAssigneeId,
                   reassignedBy, at }.

  chat.blocked / chat.unblocked:
    - assert: chat.blocked
      description: |
        Payload: { chatId, blockedByParticipantId, blockedByUserId, reason?,
                   blockedAt }.
    - assert: chat.unblocked
      description: |
        Payload: { chatId, unblockedByParticipantId, unblockedByUserId, at }.

  chat.message.reported / chat.reported:
    - assert: chat.message.reported
      description: |
        Payload: { chatId, messageId, reporterParticipantId, reporterUserId,
                   category, reason, at }.
    - assert: chat.reported
      description: |
        Payload: { chatId, reporterParticipantId, reporterUserId,
                   category, reason, at }.

  # ==================== ИНТЕГРАЦИЯ С TICKETS ====================

  Связь с фичей tickets (модель «один чат на пару»):
    - assert: tickets-feature слушает chat.message.created и создаёт тикет на каждый item-ref в attachments
      description: |
        Чат — единая нить общения между пользователем и организацией (один на пару).
        Тикет — единица обработки конкретного «обращения» (про конкретный товар).
        Триггер: сообщение содержит attachment kind='item-ref'. На каждый такой
        attachment создаётся отдельный тикет с привязкой (chatId, itemId).
        Маппинг (chat participants + attachment) → board:
          [user, organization] + item-ref → board орг (отдельная подписка)
          [user, support]                 → support-board (тикет создаётся независимо от item-ref)
          [support, organization]         → support-board
        Точное соответствие board'ов и подписок — отдельная задача расширения
        в tickets-subscriptions.spec.yaml.
    - assert: Идемпотентность тикета — по (chatId, messageId, itemId)
      description: |
        Повторная доставка одного `chat.message.created` (retry publish) не создаёт
        второй тикет на ту же пару (messageId, itemId). consumer хранит ключ.
    - assert: Переход тикета done / reopen — ответственность tickets-feature
      description: |
        Чат не имеет состояния «закрыт» / «решено». Workflow обращения
        («в работе → done → reopen») живёт целиком на стороне тикета и
        управляется его собственными командами/событиями. Chat шлёт только
        chat.opened (создание чата), события сообщений / claim'ов / блокировок.
    - assert: chat.message.created без attachments — обновляет updatedAt существующих тикетов чата, не создаёт новых
      description: |
        Семантика updatedAt тикета = «последняя активность в диалоге», а не
        «последний ответ оператора». Сообщения без item-ref (просто текст / медиа)
        бамают updatedAt всех открытых тикетов, привязанных к chatId.
    - assert: chat.opened и chat.message.created для первого сообщения публикуются в одной транзакции
      description: |
        Lazy chat creation: чат создаётся вместе с первым сообщением (POST /chats).
        Outbox-rows для chat.opened и chat.message.created вставляются в одну
        транзакцию, publisher шлёт их последовательно в один partition (по chatId),
        порядок гарантирован. Tickets-consumer получает chat.opened (для регистрации
        чата) и сразу следом chat.message.created — если в attachments есть item-ref,
        тикет создаётся с непустым превью и привязкой к товару.

  # ==================== ИНТЕГРАЦИЯ С NOTIFICATIONS ====================

  Связь с фичей notifications:
    - assert: notifications-feature слушает chat.message.created
      description: |
        Получатели — все participants чата, кроме senderParticipantId.
        Для каждого participant маппинг → канал доставки:
          kind='user',         subjectId=U → push токенам user'а U
          kind='organization', subjectId=O → push в pool('organization', O)
                                              если слот claim'нут — только assignee,
                                              иначе всем в пуле
          kind='support',      subjectId=null → push в pool('support')
                                              если claim'нут — только assignee,
                                              иначе всем в пуле
        Контракт notifications-feature — отдельная спека.
    - assert: presence-aware delivery — notifications опрашивает Centrifugo presence
      description: |
        Если получатель онлайн в chat:#{chatId} — push не шлётся (in-app достаточно).
        Если только в inbox:* — push шлётся.
    - assert: chat.message.edited / chat.message.deleted не триггерят push
      description: Только in-app (через Centrifugo).

  # ==================== СКВОЗНЫЕ СЦЕНАРИИ ====================

  End-to-end интеграция:
    - assert: User инициирует чат с org → создан Chat + ChatParticipant×2 + Message → Ticket → notification
      description: |
        Цепочка из одного POST /chats:
        1. Транзакция main-api: insert Chat + insert ChatParticipant×2
           + insert Message + 2 outbox rows (chat.opened, chat.message.created)
        2. Outbox-publisher шлёт оба в Kafka chat.events
        3. tickets-consumer ловит chat.opened → создаёт Ticket с chatId
        4. notifications-consumer ловит chat.message.created → шлёт push
           в pool slot.kind='organization', subjectId=O
        5. main-api публикует в Centrifugo chat:* и inbox:* (afterCommit)
    - assert: Идемпотентность — повторная доставка chat.opened не создаёт второй тикет
    - assert: Идемпотентность — повторная доставка chat.message.created не создаёт второй пуш
    - assert: claim+send атомарно → события participant.claimed и chat.message.created публикуются в одном commit'е
      description: |
        Outbox-rows для обоих событий вставляются в одну транзакцию,
        publisher шлёт их последовательно (порядок сохраняется в пределах
        partition'а chatId).

definitions:

feature: Discovery Categories HTTP
code: discovery-categories
description: |
  Публичный HTTP-API для дерева категорий каталога. Метаданные категорий
  больше НЕ проецируются в discovery — discovery-handlers читают их
  на запрос через `CategoryDirectoryPort` (cms write-side).
  Тонкое событие `category.changed` нужно только для:
    1) обновления Meili-индекса search-suggestions;
    2) cascade re-sync items в поддереве (closure в `discovery_item_categories`).

  Эндпоинты:
    GET /categories                 — корневые или дочерние published-категории.
    GET /categories/:id/filters     — фильтры (атрибуты, типы, common-флаги).

specs-unit:
  GET /categories:
    - assert: возвращает пустой массив при отсутствии категорий
      description: Пустой каталог — пустой массив, без 404.
    - assert: возвращает корневые категории
      description: Без `parentCategoryId` отдаются только корневые published-категории.
    - assert: возвращает iconUrl вместо iconId
      description: |
        Каждая категория содержит резолвнутый `iconUrl` (строка), а не сырой
        `iconId`. URL получается через `MediaService.createDownloadUrlsLoader`
        с `imageProxy`.
    - assert: возвращает детей по parentCategoryId
      description: Передача `parentCategoryId` фильтрует выдачу прямыми детьми.
    - assert: сортирует категории по order asc, затем по name asc
      description: |
        Стабильная сортировка: сначала по `order` по возрастанию,
        внутри одного `order` — по `name`.
    - assert: исчезает из выдачи после unpublish
      description: |
        Если категория переведена в `unpublished` в cms — `/categories`
        её больше не возвращает (фильтр по статусу в `CategoryDirectoryPort`).

  Projection cascade:
    - assert: переиндексирует items при republish их категории
      description: |
        После `category.changed` (status=published, parent изменился) все items
        в поддереве этой категории синкаются заново в Gorse и Meilisearch,
        обновляются junction-строки в `discovery_item_categories` (closure
        ancestor-цепи). Это структурное свойство Meili-индекса:
        `ancestorCategoryIds`-фасет хранится в каждом item-документе.

  GET /categories/:id/filters:
    - assert: возвращает 404 для несуществующей категории
      description: |
        Если category не найдена через `CategoryDirectoryPort.findById` — 404.
    - assert: возвращает фильтры с attributes и type filters
      description: |
        Возвращаются `attributeFilters` (атрибуты категории из cms)
        и `typeFilters` (разрешённые типы, читаются через
        `ItemTypeDirectoryPort.findByIds`).
    - assert: возвращает commonFilters со всеми полями true
      description: |
        Базовые фильтры (`hasPriceRange`, `hasRating`, `hasLocation`,
        `hasSchedule`, `hasEventDateTime`) включены по умолчанию.

definitions:
  feature:
    - discovery-categories
  section:

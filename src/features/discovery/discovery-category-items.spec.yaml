feature: Discovery Category Items HTTP
code: discovery-category-items
description: |
  Эндпоинт `GET /categories/:id/items` — список товаров внутри категории
  с сортировками, фильтрами, пагинацией и изоляцией по городу/возрастной
  группе. Источник данных — DB-проекция `discovery_items`.

  Сортировки: `newest`, `price-asc`, `price-desc`, `rating-desc`,
  по умолчанию — `personal` (fallback на SQL).

specs-unit:
  GET /categories/:id/items:
    - assert: возвращает пустой результат для категории без items
      description: "Категория без привязанных товаров — пустой `items`, `nextCursor: null`."
    - assert: возвращает items категории с корректной структурой
      description: |
        Структура item: `itemId`, `typeId`, `title`, `price`, `rating`,
        `reviewCount`, `media`, `hasVideo`, `owner`, `categoryIds`, плюс
        опциональные card-enrichment-поля по `widgetSettings.showOnCard`
        (см. секцию `card-enrichment`).
    - assert: включает items из дочерних категорий (поддерево)
      description: |
        Запрос по категории X возвращает items, привязанные напрямую к X
        и к любой её прямой/непрямой дочерней категории. Поддерево резолвится
        через `discovery_categories.ancestor_ids`.

  sorting:
    - assert: sort=newest сортирует items по publishedAt по убыванию
      description: По убыванию `publishedAt`.
    - assert: sort=price-asc сортирует items по price по возрастанию
    - assert: sort=price-desc сортирует items по price по убыванию
    - assert: sort=rating-desc сортирует items по rating по убыванию

  filtering:
    - assert: фильтрует по typeIds
      description: Параметр `typeIds` — точное совпадение по типу товара.
    - assert: фильтрует по priceMin и priceMax
      description: Диапазон цены — оба конца включительно.
    - assert: фильтрует по minRating
      description: Минимальный рейтинг (>=).

  pagination:
    - assert: пагинация курсором
      description: |
        Курсорная пагинация: `nextCursor` ведёт на следующую страницу,
        на последней — `null`. Все итемы уникальны между страницами.

  ageGroup isolation:
    - assert: не возвращает adults items при ageGroup=children
    - assert: не возвращает children items при ageGroup=adults
    - assert: возвращает items с ageGroup=all для обеих аудиторий
      description: |
        Возрастная группа `all` видна обеим аудиториям.

  city isolation:
    - assert: не возвращает items из другого города
      description: Жёсткая фильтрация по `cityId`.

  combined filters:
    - assert: фильтрует по typeIds AND priceRange одновременно
      description: Логическое AND между фильтрами разной природы.
    - assert: фильтрует по minRating AND typeIds одновременно

  card-enrichment:
    - assert: ItemListView включает поля от виджетов с showOnCard=true
      description: |
        Источник истины — `widgetSettings[].showOnCard` на ItemType item-а
        (см. `cms-item-types`). Если виджет card-eligible включён —
        соответствующее поле подмешивается в ItemListView, иначе null:
          event-date-time → eventDateTime: string | null
                            (ISO ближайшей будущей даты)
          schedule        → nextScheduleSlot: { dayOfWeek, startTime, endTime } | null
                            (первый upcoming slot)
          location        → distanceKm: number | null
                            (требует lat/lng в запросе; без них null)
          age-group       → cardAgeGroup: 'adults'|'children'|'all'|null
        Контракт един для feed/category-items/liked-items/search.
        Per-type widgetSettings читается батчем по уникальным typeId.
    - assert: eventDateTime подмешивается, если виджет включён
      description: |
        Тип имеет event-date-time с showOnCard=true и у item-а есть
        будущие даты — eventDateTime = ISO ближайшей будущей даты.
    - assert: eventDateTime=null, если showOnCard=false
      description: |
        Даже при наличии будущих дат у item-а — поле null, если виджет
        event-date-time выключен на карточке.
    - assert: nextScheduleSlot подмешивается при showOnCard на schedule
      description: |
        schedule с showOnCard=true → nextScheduleSlot = ближайший
        upcoming slot { dayOfWeek, startTime, endTime }.
    - assert: cardAgeGroup подмешивается при showOnCard на age-group
      description: |
        age-group с showOnCard=true → cardAgeGroup = значение возраста
        item-а ('adults'|'children'|'all').
    - assert: distanceKm подмешивается при наличии user-location и showOnCard на location
      description: |
        location с showOnCard=true + lat/lng в запросе + у item-а есть
        координаты → distanceKm = расстояние в км (haversine, до 0.1 км).
    - assert: distanceKm=null без user-location
      description: |
        Запрос без lat/lng → distanceKm=null, даже если виджет location
        включён на карточке.
    - assert: все enrichment-поля null при отсутствии showOnCard
      description: |
        ItemType без card-eligible виджетов с showOnCard=true →
        eventDateTime/nextScheduleSlot/distanceKm/cardAgeGroup всё null.

  defaults:
    - assert: работает с дефолтным sort (personal) с fallback на SQL
      description: |
        Без указания `sort` — режим `personal`, с фолбэком на SQL,
        если рекомендатель ничего не вернул.
    - assert: использует дефолтный limit 20

definitions:
  feature:
    - discovery-category-items
  section:
    - discovery

feature: Discovery Projection Handlers
code: discovery-handlers
description: |
  Kafka-обработчики discovery, которые реагируют на тонкие интеграционные
  события (`organization.changed` / `item.changed` / `category.changed` /
  `item-type.changed` / `review.created` / `interaction.*` / `user.profile-changed`).

  Все «жирные» снимки убраны: handler читает свежий state через kernel
  directory-порты (`OrganizationDirectoryPort`, `ItemDirectoryPort`,
  `CategoryDirectoryPort`, `ItemTypeDirectoryPort`, `UserDirectoryPort` —
  реализуются в feature-владельцах данных).

  Локальные проекции в discovery остались только там, где нужны для hot-path
  фильтрации/выборок:
    - `discovery_owners` — denormalized {name, avatar, team, rating, reviewCount};
    - `discovery_items` + `discovery_item_categories` (closure) +
      attribute/event/schedule junction tables — рабочий набор для search/feed/browse.
  Метаданные категорий и item-types в discovery НЕ проецируются.

  Search-suggestions (categories/item-types/orgs) живут в Meili-индексах,
  обновляются на тех же тонких событиях.

  Все обработки идемпотентны и поддерживают каскады (publish организации
  обновляет связанные items, unpublish — удаляет их).

specs-unit:
  Owner projection:
    - assert: проецирует organization.changed в discovery_owners
      description: |
        На `organization.changed` handler читает свежий state через
        `OrganizationDirectoryPort.findById`. Если published — upsert
        в `discovery_owners`: `name`, `avatarId`, `rating: null`,
        `reviewCount: 0` по умолчанию (rating сохраняется на conflict).
        Имя организации индексируется в Meili `discovery_organizations_search`.
    - assert: обновляет owner и каскадно items при изменении
      description: |
        Очередное `organization.changed` (повторная публикация / правка)
        обновляет denormalized поля в owner и `ownerName`/`ownerAvatarId`
        во всех привязанных items + переиндексирует их в Meili.
        Rating/reviewCount в owner НЕ затирается.
    - assert: удаляет owner и все items при unpublish
      description: |
        Если `OrganizationDirectoryPort.findById` вернул `null` (организация
        не опубликована / удалена) — handler удаляет owner, search-индекс
        и каскадно все items этой организации (Gorse + Meilisearch).

  Item projection:
    - assert: проецирует item.changed в discovery_items с widgets
      description: |
        На `item.changed` handler читает свежий state через
        `ItemDirectoryPort.findById`. Если published — мапит widgets в
        denormalized плоскую структуру (`title`, `description`, `media`,
        `cityId`, `lat/lng`, `address`, `paymentOptions`, `minPrice`,
        `organizationId`, `ownerName`) и пишет в `discovery_items` +
        Gorse + Meilisearch. В `discovery_item_categories` сохраняется
        closure (direct ∪ ancestors) через `CategoryDirectoryPort.findAncestorClosure`.
    - assert: удаляет item при отсутствии state (unpublish/delete)
      description: |
        Если `ItemDirectoryPort.findById` вернул `null` — handler удаляет
        запись из `discovery_items`, junction-таблиц, Gorse и Meilisearch.

  Review projection:
    - assert: обновляет рейтинг item при review.created с target=item
      description: |
        `review.created` с `target.targetType=item` обновляет `itemRating`
        и `itemReviewCount` у item.
    - assert: обновляет рейтинг owner при review.created с target=organization
      description: |
        `review.created` с `target.targetType=organization` обновляет
        рейтинг owner и каскадно `ownerRating`/`ownerReviewCount` у его
        items.


feature: CMS Item Types
code: cms-item-types
description: |
  Типы товаров/услуг (item-type) — справочник, на который ссылаются категории
  через allowedTypeIds.

  Каждый тип содержит:
    - id, name, label;
    - widgetSettings — список виджетов, доступных для item-карточки этого типа,
      с признаком required, опциональными параметрами виджета (например,
      allowedStrategies для 'payment') и опциональным флагом
      `showOnCard: boolean` — управляет, подмешивается ли поле виджета в
      превью-карточку публичного каталога.

  Card-eligible виджеты (можно ставить `showOnCard=true`):
    base-info, owner, payment, item-review, location, event-date-time,
    schedule, age-group.
  Always-on-card (всегда показываются на карточке, нельзя ставить
    `showOnCard=false`; UI рендерит чекбокс locked-checked):
    base-info, owner, payment, item-review, location.
  Опционально-на-карточке (toggleable showOnCard, default false):
    event-date-time, schedule, age-group.
  НЕ card-eligible:
    category, owner-review, contact-info, team.

  Инвариант widgetSettings: каждый type встречается не более одного раза.

  Поведение публичного вывода полей карточки описано в `discovery-card-display`.

specs-unit:
  # ==================== CRUD ====================

  CRUD:
    - assert: создаёт item type
      description: |
        POST /cms/item-types с body { id, name, label, widgetSettings }.
        Ответ 201 содержит id, name, widgetSettings.
    - assert: возвращает список item types
      description: |
        GET /cms/item-types возвращает массив типов.
    - assert: обновляет item type
      description: |
        PATCH /cms/item-types/:id обновляет name, label, widgetSettings.

  # ==================== ВАЛИДАЦИЯ ====================

  Validation:
    - assert: отклоняет дублирующиеся типы виджетов в settings
      description: |
        widgetSettings не должен содержать два элемента с одинаковым type — 400.

  # ==================== CARD DISPLAY (showOnCard) ====================

  CardDisplay:
    - assert: showOnCard=true разрешён только для card-eligible виджетов
      description: |
        Card-eligible: base-info, owner, payment, item-review, location,
        event-date-time, schedule, age-group.
        Для остальных (category, owner-review, contact-info, team) —
        400 CardDisplayNotAllowedForWidgetType.
    - assert: showOnCard=true принимается для card-eligible виджетов
      description: |
        POST с showOnCard=true на payment/event-date-time/location и т.п. —
        201, и значение возвращается в widgetSettings ответа.
    - assert: showOnCard=false принимается для не always-on виджетов
      description: |
        Опционально-на-карточке (event-date-time, schedule, age-group) и
        не card-eligible (team и др.) — showOnCard=false валидно.
    - assert: showOnCard=false запрещён для always-on виджетов
      description: |
        Always-on (base-info, owner, payment, item-review, location) —
        показ на карточке нельзя выключить. POST/PATCH с showOnCard=false
        для них → 400 CardDisplayCannotBeDisabled.
    - assert: PATCH отклоняет showOnCard=true для не-card-eligible виджетов
      description: |
        Та же проверка, что и для POST, применяется и к PATCH /cms/item-types/:id.

  # ==================== ПРАВА ====================

  Permissions:
    - assert: Без авторизации — 401
    - assert: Пользователь без manageCms — 403
      description: |
        Управление item-types (включая showOnCard) требует permission manageCms.

definitions:
  feature:
    - cms-item-types
  section:
    - cms
